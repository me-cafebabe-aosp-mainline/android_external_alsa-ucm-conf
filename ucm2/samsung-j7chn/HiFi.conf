# Use case configuration for Samsung Galaxy J7 (2015) (SM-J7008).
# All analog outputs/inputs connected to the internal PM8916 codec.
# Only the PrimaryMic (AMIC1) and the headset mic (AMIC2) are described: the
# downstream audio routing also lists a "Secondary Mic" on AMIC3, but it is not
# known whether the phone has a second microphone.

Define {
	WcdPlaybackPCM "hw:${CardId},0"
	WcdCapturePCM "hw:${CardId},1"
}
<platforms/msm8916/qdsp6-components.conf>

<codecs/msm8916-wcd/Speaker.conf>
<codecs/msm8916-wcd/Earpiece.conf>
<codecs/msm8916-wcd/Headphones.conf>

<codecs/msm8916-wcd/PrimaryMic.conf>
<codecs/msm8916-wcd/HeadsetMic.conf>
