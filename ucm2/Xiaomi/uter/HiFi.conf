# Use case configuration for Xiaomi uter

SectionVerb {
	EnableSequence [
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 1"
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1 Capture Mixer TERT_MI2S_TX' 1"
	]
	DisableSequence [
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 0"
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='VoiceMMode1 Capture Mixer TERT_MI2S_TX' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	# A frontend can be routed to one backend only: Speaker is on QUAT_MI2S,
	# Earpiece and Headphones are on PRI_MI2S.
	ConflictingDevice [
		"Earpiece"
		"Headphones"
	]

	EnableSequence [
                cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
                cset "name='Boost Output Voltage' 10V"
                cset "name='Speaker Volume' 5"
                cset "name='Digital Volume' 56"
	]

	DisableSequence [
                cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
                cset "name='Boost Output Voltage' 6.5V"
                cset "name='Speaker Volume' 1"
                cset "name='Digital Volume' 40"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 200
		PlaybackChannels 1
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece playback"

	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RDAC2 MUX' RX1"
		cset "name='EAR_S' 1"
	]

	DisableSequence [
		cset "name='EAR_S' 0"
		cset "name='RX1 MIX1 INP1' ZERO"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 100
		PlaybackChannels 1
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	ConflictingDevice [
		"Speaker"
		"Earpiece"
	]

	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RX2 MIX1 INP1' RX2"
		cset "name='RDAC2 MUX' RX2"
		cset "name='HPHL' 1"
		cset "name='HPHR' 1"
	]

	DisableSequence [
		cset "name='HPHL' 0"
		cset "name='HPHR' 0"
		cset "name='RX1 MIX1 INP1' ZERO"
		cset "name='RX2 MIX1 INP1' ZERO"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 300
		PlaybackChannels 2
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic1" {
	Comment "Primary Microphone"

	ConflictingDevice [
		"Headset"
		"Mic2"
	]

	Include.pmes.File "/codecs/msm8953-wcd/PrimaryMicEnableSeq.conf"
	Include.pmds.File "/codecs/msm8953-wcd/PrimaryMicDisableSeq.conf"

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CapturePriority 300
	}
}

SectionDevice."Mic2" {
	Comment "Secondary Microphone"

	ConflictingDevice [
		"Headset"
		"Mic1"
	]

	Include.smes.File "/codecs/msm8953-wcd/SecondaryMicEnableSeq.conf"
	Include.smds.File "/codecs/msm8953-wcd/SecondaryMicDisableSeq.conf"

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CapturePriority 200
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic1"
		"Mic2"
	]

	Include.hmes.File "/codecs/msm8953-wcd/HeadsetMicEnableSeq.conf"
	Include.hmds.File "/codecs/msm8953-wcd/HeadsetMicDisableSeq.conf"

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CapturePriority 400
		JackControl "Mic Jack"
	}
}

