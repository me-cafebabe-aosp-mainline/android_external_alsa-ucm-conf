# Use case configuration for Samsung Galaxy A3/A5 (2015) (sound card "samsung-a2015").
# The loudspeaker is driven by an NXP TFA9895 amplifier on Quaternary MI2S,
# which the msm8916 platform routes from MultiMedia3 (PCM 2).
# Earpiece, headphones and microphones use the internal PM8916 codec.

Define {
	WcdPlaybackPCM "hw:${CardId},0"
	WcdCapturePCM "hw:${CardId},1"
}
<platforms/msm8916/qdsp6-components.conf>

SectionDevice."Speaker" {
	Comment "Speaker playback"

	ConflictingDevice [
		"Headphones"
		"Earpiece"
	]

	Value {
		PlaybackPCM "hw:${CardId},2"
		PlaybackChannels 2
		PlaybackPriority 200
	}
}

<codecs/msm8916-wcd/Earpiece.conf>
<codecs/msm8916-wcd/Headphones.conf>

<codecs/msm8916-wcd/PrimaryMic.conf>
<codecs/msm8916-wcd/SecondaryMic.conf>
<codecs/msm8916-wcd/HeadsetMic.conf>
